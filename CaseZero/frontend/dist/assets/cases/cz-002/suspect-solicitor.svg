<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgS" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b6a88e"/>
      <stop offset="100%" stop-color="#726048"/>
    </radialGradient>
    <filter id="grnS">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="vigS" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#241a10" stop-opacity="0.88"/>
    </radialGradient>
  </defs>
  <!-- Aged background -->
  <rect width="400" height="500" fill="url(#bgS)"/>
  <rect width="400" height="500" fill="url(#vigS)"/>

  <!-- Body / attire: Victorian lawyer tailored charcoal 3-piece suit -->
  <ellipse cx="200" cy="450" rx="140" ry="85" fill="#161418"/>
  <rect x="125" y="325" width="150" height="150" rx="15" fill="#1e1c22"/>
  <!-- Stiff wing collar -->
  <path d="M170 302 L200 324 L230 302 L220 330 L180 330 Z" fill="#eae2d2"/>
  <!-- Dark silk tie with gold pin -->
  <path d="M194 324 L206 324 L203 385 L197 385 Z" fill="#0d0c10"/>
  <circle cx="200" cy="336" r="2.2" fill="#d4af37"/>
  <!-- Gold pocket watch Albert chain loop -->
  <path d="M155 385 Q180 410 205 390" fill="none" stroke="#d4af37" stroke-width="1.8"/>

  <!-- Head — sharp, angular features -->
  <polygon points="138,185 262,185 250,285 200,305 150,285" fill="#c2a27e"/>
  <!-- Hair — slicked-back jet black hair, neat side part -->
  <path d="M136 185 Q130 145 160 135 Q200 130 245 138 Q268 148 264 185 Q255 155 225 146 Q180 142 145 155 Q138 168 136 185" fill="#141212"/>
  <ellipse cx="200" cy="150" rx="64" ry="25" fill="#1a1818"/>

  <!-- Ears -->
  <ellipse cx="134" cy="220" rx="7.5" ry="13" fill="#b4926e"/>
  <ellipse cx="266" cy="220" rx="7.5" ry="13" fill="#b4926e"/>

  <!-- Forehead tension lines -->
  <path d="M172 178 Q200 174 228 178" fill="none" stroke="#8c6c4c" stroke-width="1" opacity="0.6"/>

  <!-- Eyes — sharp, guarded, dark brown -->
  <ellipse cx="173" cy="214" rx="11" ry="7" fill="#181410"/>
  <ellipse cx="227" cy="214" rx="11" ry="7" fill="#181410"/>
  <circle cx="173" cy="214" r="5" fill="#1a1612"/>
  <circle cx="227" cy="214" r="5" fill="#1a1612"/>
  <circle cx="175" cy="212" r="1.3" fill="#e8e8e8"/>
  <circle cx="229" cy="212" r="1.3" fill="#e8e8e8"/>

  <!-- Eyebrows — sharp, severe angled dark brows -->
  <path d="M158 202 L175 198 L188 203" fill="none" stroke="#161412" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M212 203 L225 198 L242 202" fill="none" stroke="#161412" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Nose — aquiline, thin and straight -->
  <path d="M198 206 L195 242 L206 242" fill="none" stroke="#94704e" stroke-width="1.8"/>

  <!-- Clean-shaven, thin pursed lips -->
  <path d="M182 262 Q200 260 218 262" fill="none" stroke="#7e4c38" stroke-width="2" stroke-linecap="round"/>
  <path d="M185 262 Q200 264 215 262" fill="none" stroke="#603020" stroke-width="1"/>

  <!-- Sharp jaw & cleft chin hint -->
  <path d="M196 288 Q200 292 204 288" fill="none" stroke="#8a6848" stroke-width="1.2"/>

  <!-- Grain texture overlay -->
  <rect width="400" height="500" fill="#6a5430" opacity="0.12" filter="url(#grnS)"/>
  <!-- Damaged corners -->
  <path d="M0 0 L30 0 L0 30 Z" fill="#20180e" opacity="0.4"/>
  <path d="M400 500 L370 500 L400 470 Z" fill="#20180e" opacity="0.4"/>

  <!-- Bottom title card -->
  <rect x="0" y="460" width="400" height="40" fill="#120e0a" opacity="0.8"/>
  <text x="200" y="478" font-family="Georgia,serif" font-size="13" fill="#c4b490" text-anchor="middle">EDWIN PIKE</text>
  <text x="200" y="494" font-family="monospace" font-size="9" fill="#8a7a5a" text-anchor="middle">Family Solicitor · Legal Adviser</text>
</svg>
