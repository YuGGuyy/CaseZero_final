<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgW" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c4b99a"/>
      <stop offset="100%" stop-color="#8a7d64"/>
    </radialGradient>
    <filter id="grnW">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <!-- Aged photograph background -->
  <rect width="400" height="500" fill="url(#bgW)"/>
  <!-- Vignette -->
  <radialGradient id="vigW" cx="50%" cy="50%" r="70%">
    <stop offset="50%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#3a2e20" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="400" height="500" fill="url(#vigW)"/>
  <!-- Figure silhouette — Lady Eleanor, aristocratic Victorian woman -->
  <!-- Body / dress — dark mourning colours -->
  <ellipse cx="200" cy="440" rx="130" ry="80" fill="#1a1410"/>
  <rect x="130" y="320" width="140" height="150" rx="20" fill="#1e1814"/>
  <!-- Collar detail -->
  <ellipse cx="200" cy="325" rx="35" ry="15" fill="#2a2420"/>
  <!-- High collar with lace -->
  <path d="M165 310 Q200 295 235 310 L235 330 Q200 340 165 330 Z" fill="#d4c8a4"/>
  <!-- Lace pattern on collar -->
  <path d="M170 314 Q185 308 200 314 Q215 308 230 314" fill="none" stroke="#b0a480" stroke-width="0.8"/>
  <path d="M170 318 Q185 312 200 318 Q215 312 230 318" fill="none" stroke="#b0a480" stroke-width="0.8"/>
  <!-- Head -->
  <ellipse cx="200" cy="220" rx="68" ry="80" fill="#c4a882"/>
  <!-- Hair — Victorian updo, dark -->
  <ellipse cx="200" cy="160" rx="72" ry="45" fill="#1e1810"/>
  <path d="M132 200 Q128 165 145 150 Q162 140 200 140 Q238 140 255 150 Q272 165 268 200" fill="#1e1810"/>
  <!-- Hair bun -->
  <ellipse cx="200" cy="145" rx="35" ry="22" fill="#251e14"/>
  <!-- Hairpin detail -->
  <line x1="185" y1="140" x2="215" y2="140" stroke="#6a5a30" stroke-width="1.5"/>
  <!-- Ear -->
  <ellipse cx="133" cy="222" rx="9" ry="13" fill="#b89870"/>
  <ellipse cx="267" cy="222" rx="9" ry="13" fill="#b89870"/>
  <!-- Earring (pearl drop) -->
  <circle cx="133" cy="238" r="5" fill="#d8d0c0" stroke="#a8a090" stroke-width="0.5"/>
  <circle cx="267" cy="238" r="5" fill="#d8d0c0" stroke="#a8a090" stroke-width="0.5"/>
  <!-- Eyes -->
  <ellipse cx="175" cy="215" rx="12" ry="9" fill="#2a2018"/>
  <ellipse cx="225" cy="215" rx="12" ry="9" fill="#2a2018"/>
  <ellipse cx="175" cy="215" rx="7" ry="6" fill="#1a3050"/>
  <ellipse cx="225" cy="215" rx="7" ry="6" fill="#1a3050"/>
  <circle cx="177" cy="213" r="2" fill="#080806"/>
  <circle cx="227" cy="213" r="2" fill="#080806"/>
  <circle cx="179" cy="212" r="1" fill="#e8e8e8"/>
  <circle cx="229" cy="212" r="1" fill="#e8e8e8"/>
  <!-- Eyebrows — arched, aristocratic -->
  <path d="M162 204 Q175 198 188 202" fill="none" stroke="#2a1e10" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M212 202 Q225 198 238 204" fill="none" stroke="#2a1e10" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M196 225 Q200 240 204 225" fill="none" stroke="#a08060" stroke-width="1.5"/>
  <ellipse cx="195" cy="238" rx="5" ry="4" fill="#b08870" opacity="0.5"/>
  <ellipse cx="205" cy="238" rx="5" ry="4" fill="#b08870" opacity="0.5"/>
  <!-- Mouth — composed, closed -->
  <path d="M183 252 Q200 258 217 252" fill="none" stroke="#8a5840" stroke-width="2" stroke-linecap="round"/>
  <path d="M186 252 Q200 246 214 252" fill="#d4a080" stroke="none"/>
  <!-- Cameo brooch -->
  <ellipse cx="200" cy="342" rx="14" ry="18" fill="#d4c8a0" stroke="#a89870" stroke-width="1.5"/>
  <ellipse cx="200" cy="342" rx="10" ry="14" fill="#c4a880" stroke="#a89870" stroke-width="1"/>
  <ellipse cx="200" cy="338" rx="6" ry="8" fill="#8a7050"/>
  <!-- Grain texture -->
  <rect width="400" height="500" fill="#7a6844" opacity="0.12" filter="url(#grnW)"/>
  <!-- Photo border damage (aged corners) -->
  <path d="M0 0 L30 0 L0 30 Z" fill="#3a2e20" opacity="0.4"/>
  <path d="M400 500 L370 500 L400 470 Z" fill="#3a2e20" opacity="0.4"/>
  <!-- Label -->
  <rect x="0" y="460" width="400" height="40" fill="#1a1408" opacity="0.7"/>
  <text x="200" y="478" font-family="Georgia,serif" font-size="13" fill="#c4b490" text-anchor="middle">LADY ELEANOR BLACKWOOD</text>
  <text x="200" y="494" font-family="monospace" font-size="9" fill="#8a7a5a" text-anchor="middle">Widow · Co-trustee</text>
</svg>
